name: Build the index

# Scheduled hourly (GitHub runs it every few hours): grade every Ref-priced NEAR token, verify the edition and publish it to `latest`.
#
# Two jobs, so the job that runs third-party code never holds a write token: `build` reads only
# and hands the edition over as an artifact; `publish` writes but only copies files and runs git.
# Third-party actions are pinned to commit SHAs so a moved tag cannot change what runs.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the latest edition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: latest
          path: latest
          persist-credentials: false

      - name: Check out the Svalin code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: noobshole/svalin-agent
          path: svalin
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: svalin/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: svalin/pnpm-lock.yaml

      - name: Install
        working-directory: svalin
        run: |
          pnpm install --frozen-lockfile --filter "@svalin-agent/api..."
          pnpm --filter "@svalin-agent/api^..." build
          echo "SVALIN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the edition
        working-directory: svalin
        run: pnpm --filter @svalin-agent/api run index:near "$GITHUB_WORKSPACE/latest"

      - name: Verify the edition
        working-directory: svalin
        run: pnpm --filter @svalin-agent/api run index:verify "$GITHUB_WORKSPACE/latest"

      - name: Hand over the edition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edition
          path: latest
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the record
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: record

      - name: Check out the latest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: latest
          path: latest

      - name: Receive the edition
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: edition
          path: edition

      - name: Publish the edition
        working-directory: latest
        run: |
          test -f ../edition/edition.json
          git config user.name "svalin-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan next
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../edition/. .
          git add -A
          git commit -q -m "Edition $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force origin next:latest

      # Once a day, the edition is copied into editions/ on main and never changed again.
      - name: Seal the daily edition
        working-directory: record
        run: |
          day=$(date -u +%Y-%m-%d)
          if [ -d "editions/$day" ]; then exit 0; fi
          mkdir -p "editions/$day"
          cp -r ../edition/edition.json ../edition/near-token-index.json ../edition/inputs "editions/$day/"
          git config user.name "svalin-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions
          git commit -q -m "Seal edition $day ($(jq -r .fingerprint "editions/$day/edition.json"))"
          git push -q
