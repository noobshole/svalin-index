name: Build the index

# Scheduled hourly (GitHub runs it every few hours): grade every Ref-priced NEAR token, verify the edition and publish it to `latest`.
#
# The job that runs third-party code never holds a write token: `build` reads only and hands the
# edition over as an artifact; `publish` writes but only copies files and runs git. Once a day,
# `register` puts the sealed edition's Merkle root on NEAR (the Svalin Ratings registry) with a key
# that can call nothing but `publish` there; it has no write access to this repository.
# Third-party actions are pinned to commit SHAs so a moved tag cannot change what runs.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the latest edition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: latest
          path: latest
          persist-credentials: false

      - name: Check out the Svalin code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noobshole/svalin-agent
          path: svalin
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: svalin/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: svalin/pnpm-lock.yaml

      - name: Install
        working-directory: svalin
        run: |
          pnpm install --frozen-lockfile --filter "@svalin-agent/api..."
          pnpm --filter "@svalin-agent/api^..." build
          echo "SVALIN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the edition
        working-directory: svalin
        run: pnpm --filter @svalin-agent/api run index:near "$GITHUB_WORKSPACE/latest"

      - name: Verify the edition
        working-directory: svalin
        run: pnpm --filter @svalin-agent/api run index:verify "$GITHUB_WORKSPACE/latest"

      - name: Hand over the edition
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edition
          path: latest
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
    steps:
      - name: Check out the record
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: record

      - name: Check out the latest branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: latest
          path: latest

      - name: Receive the edition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edition
          path: edition

      - name: Publish the edition
        working-directory: latest
        run: |
          test -f ../edition/edition.json
          git config user.name "svalin-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan next
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../edition/. .
          git add -A
          git commit -q -m "Edition $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub sometimes answers a push with a server error that passes in seconds: try three times.
          for try in 1 2 3; do
            git push -q --force origin next:latest && exit 0
            echo "The push failed (try $try of 3)."
            if [ "$try" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      # Once a day, the edition is copied into editions/ on main and never changed again.
      - name: Seal the daily edition
        id: seal
        working-directory: record
        run: |
          # The edition's own date, so its leaves, its folder and its root on NEAR agree.
          day=$(jq -r '.generatedAt[0:10]' ../edition/edition.json)
          if [ -d "editions/$day" ]; then exit 0; fi
          mkdir -p "editions/$day"
          cp -r ../edition/edition.json ../edition/near-token-index.json ../edition/near-token-tree.bin ../edition/near-token-root.json ../edition/inputs "editions/$day/"
          git config user.name "svalin-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions
          git commit -q -m "Seal edition $day ($(jq -r .fingerprint "editions/$day/edition.json"))"
          for try in 1 2 3; do
            if git push -q; then
              echo "sealed=$day" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "The push failed (try $try of 3)."
            if [ "$try" -lt 3 ]; then sleep 20; fi
          done
          exit 1

  register:
    needs: publish
    if: needs.publish.outputs.sealed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the Svalin code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noobshole/svalin-agent
          path: svalin
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: svalin/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: svalin/pnpm-lock.yaml

      - name: Install
        working-directory: svalin
        run: |
          pnpm install --frozen-lockfile --filter "@svalin-agent/api..."
          pnpm --filter "@svalin-agent/api^..." build

      - name: Receive the edition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edition
          path: edition

      # The registry refuses a second root for a day, and the script publishes nothing when the
      # day is already there, so a rerun is harmless.
      - name: Put the root on NEAR
        working-directory: svalin
        env:
          NEAR_RATINGS_PUBLISHER_KEY: ${{ secrets.NEAR_RATINGS_PUBLISHER_KEY }}
          NEAR_RATINGS_REGISTRY: svalin-ratings-v1.testnet
        run: pnpm --filter @svalin-agent/api run index:register "$GITHUB_WORKSPACE/edition"
